name: Phase 3 Editorial Checks
on:
  pull_request:
    paths:
      - 'scripts/editorial.py'
      - 'scripts/editorial_queue.py'
      - 'scripts/article_evidence.py'
      - 'tests/**'
      - '.github/workflows/editorial-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile editorial scripts
        run: python -m py_compile scripts/editorial.py scripts/editorial_queue.py scripts/article_evidence.py
      - name: Run all offline tests
        run: python -m unittest discover -s tests -v
