name: Research collection

on:
  schedule:
    - cron: '0 18 * * *'
      timezone: America/Chicago
  workflow_dispatch:
    inputs:
      history_run_id:
        description: Optional prior research workflow run ID to continue its history
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: research-collection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Run offline tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s research/tests -v
      - name: Choose the prior history run
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
          HISTORY_RUN_ID: ${{ inputs.history_run_id }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            HISTORY_RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/research-collection.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          fi
          if [[ -n "$HISTORY_RUN_ID" && ! "$HISTORY_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]; then
            echo "::error::Use a GitHub Actions run ID for history."
            exit 1
          fi
          echo "run_id=$HISTORY_RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Restore prior research history
        if: steps.history.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.history.outputs.run_id }}
          name: research-data
          path: prior-research-data
      - name: Reuse the saved database
        if: steps.history.outputs.run_id != ''
        run: |
          mkdir -p research-data
          cp prior-research-data/history.sqlite3 research-data/history.sqlite3
      - name: Collect research
        id: collection
        run: python -m research
      - name: Verify official claims and generate briefing draft
        run: python -m research.briefing --verify --output research-data/briefing-draft.md
      - name: Upload snapshot, source health, and history
        if: always() && (steps.collection.outcome == 'success' || steps.collection.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: research-data
          path: research-data/
          if-no-files-found: error
