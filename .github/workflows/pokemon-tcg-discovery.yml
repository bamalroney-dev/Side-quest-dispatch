name: Pokémon TCG discovery (review only)
on:
  workflow_dispatch:
  schedule:
    - cron: '15 1,13 * * *'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: pokemon-tcg-review
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tracker and discovery tests
        run: python -m unittest discover -s tests -p 'test_pokemon_tcg_discovery*.py' -v
      - name: Preserve reviewed workflow helper outside branch checkout
        run: cp scripts/pokemon_tcg_review_pr.sh "$RUNNER_TEMP/pokemon_tcg_review_pr.sh"
      - name: Resume existing review branch safely
        run: bash "$RUNNER_TEMP/pokemon_tcg_review_pr.sh" prepare
      - name: Discover official announcement candidates
        run: python scripts/pokemon_tcg_discovery.py
      - name: Open or update review pull request (never merge)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/pokemon_tcg_review_pr.sh" publish
